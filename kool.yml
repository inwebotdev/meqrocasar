scripts:
  setup:
    - sh -c 'test -f .env || cp .env.dist .env'
    - git config core.hooksPath .githooks
    - kool start
    - kool exec app yarn install
  yarn:
    - kool exec app yarn
  dev:
    - kool exec app yarn dev --hostname 0.0.0.0 --port 3000
  build:
    - kool exec app yarn build
  test:
    - docker compose run --rm --no-deps -T app yarn test
  setup:full:
    - kool run setup
    - kool run kb:refresh
  kb:refresh:
    - kool run kb:ingest
    - kool run kb:build
    - kool run kb:enrich
  kb:ingest:
    - docker compose run --rm --no-deps -T --env-from-file .env app yarn tsx scripts/kb/ingest-places.ts
  kb:build:
    - docker compose run --rm --no-deps -T app yarn tsx scripts/kb/build-venues.ts
  kb:enrich:
    - docker compose run --rm --no-deps -T --env-from-file .env app yarn tsx scripts/kb/enrich-kb.ts
  ai:bench:
    - docker compose run --rm --no-deps -T --env-from-file .env app yarn tsx scripts/ai/bench-step-models.ts
  quality:
    - docker compose run --rm --no-deps -T app yarn format:check
    - docker compose run --rm --no-deps -T app yarn types:check
    - docker compose run --rm --no-deps -T app yarn lint:check
  format:
    - bash .githooks/format-staged.sh
